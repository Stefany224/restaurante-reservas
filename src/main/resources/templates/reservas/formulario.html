<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeza(${editando ? 'Modificar reserva' : 'Nueva reserva'})}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main class="angosto">
  <h1 th:text="${editando} ? 'Modificar reserva #' + ${reservaId} : 'Confirma tu reserva'">Confirma tu reserva</h1>

  <div th:replace="~{fragments :: avisos}"></div>

  <!-- th:object enlaza el formulario con ReservaForm y la misma vista sirve para crear y modificar -->
  <form class="panel formulario" method="post" th:object="${reserva}"
        th:action="${editando} ? @{/reservas/{id}/editar(id=${reservaId})} : @{/reservas}">

    <!-- Mesa, dia, hora y personas vienen del buscador y no se pueden cambiar aqui, el service igual los vuelve a validar -->
    <input type="hidden" th:field="*{mesaId}">
    <input type="hidden" th:field="*{fecha}">
    <input type="hidden" th:field="*{hora}">
    <input type="hidden" th:field="*{personas}">

    <fieldset>
      <legend>Tu reserva</legend>
      <dl class="resumen">
        <div>
          <dt>Mesa</dt>
          <dd th:if="${mesa != null}" th:text="'Mesa ' + ${mesa.numero} + ', ' + ${mesa.ubicacion.etiqueta}">Mesa 3, Salón</dd>
        </div>
        <div>
          <dt>Día</dt>
          <dd th:text="${reserva.fecha != null} ? ${#temporals.format(reserva.fecha, 'dd-MM-yyyy')} : ''">20-11-2026</dd>
        </div>
        <div>
          <dt>Hora</dt>
          <dd th:text="${reserva.hora != null} ? ${#temporals.format(reserva.hora, 'HH:mm')} : ''">20:00</dd>
        </div>
        <div>
          <dt>Personas</dt>
          <dd th:text="*{personas}">2</dd>
        </div>
      </dl>
      <!-- por si algun dato oculto llega mal, por ejemplo si escribieron la direccion a mano -->
      <p class="error-campo" th:if="${#fields.hasErrors('mesaId') or #fields.hasErrors('fecha') or #fields.hasErrors('hora') or #fields.hasErrors('personas')}">
        Faltan datos de la reserva. Vuelve a elegir la mesa en el buscador.
      </p>
      <!-- Vuelve al buscador con la busqueda actual -->
      <a class="enlace-cambiar" th:unless="${editando}"
         th:href="@{/reservas/disponibilidad(fecha=*{fecha}, hora=*{hora}, personas=*{personas})}">Cambiar día, hora o mesa</a>
      <a class="enlace-cambiar" th:if="${editando}"
         th:href="@{/reservas/disponibilidad(reservaId=${reservaId}, email=*{email}, fecha=*{fecha}, hora=*{hora}, personas=*{personas})}">Cambiar día, hora o mesa</a>

      <label>Comentario <span class="opcional">(opcional)</span>
        <textarea th:field="*{comentario}" rows="2" maxlength="200"
                  placeholder="Alergias, celebración, silla para bebé…"></textarea>
        <small class="contador-texto"><span id="comentario-usados">0</span> / 200</small>
        <small class="error-campo" th:if="${#fields.hasErrors('comentario')}" th:errors="*{comentario}"></small>
      </label>
    </fieldset>

    <fieldset>
      <legend>Tus datos</legend>
      <!-- al modificar los datos de contacto quedan bloqueados porque el correo identifica de quien es la reserva -->
      <p class="sub" th:if="${editando}">Tus datos de contacto no se pueden cambiar desde aquí.</p>
      <div class="campos">
        <label>Nombre
          <input type="text" th:field="*{nombre}" minlength="2" maxlength="30" autocomplete="name"
                 pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras y espacios" th:readonly="${editando}" required>
          <small class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
        </label>
        <label>Correo
          <input type="email" th:field="*{email}" maxlength="120" autocomplete="email"
                 placeholder="nombre@correo.cl" th:readonly="${editando}" required>
          <small class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
        </label>
        <label>Teléfono
          <input type="tel" th:field="*{telefono}" maxlength="11" inputmode="numeric" autocomplete="tel-national"
                 minlength="9" title="8 o 9 dígitos, por ejemplo 9 1234 5678" placeholder="9 1234 5678"
                 th:readonly="${editando}" required>
          <small class="error-campo" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></small>
        </label>
      </div>
    </fieldset>

    <div class="botones">
      <button type="submit" class="btn" th:text="${editando} ? 'Guardar cambios' : 'Confirmar reserva'">Confirmar reserva</button>
      <a class="btn btn-sec" th:if="${editando}" th:href="@{/reservas/mis-reservas(email=*{email})}">Volver</a>
      <a class="btn btn-sec" th:unless="${editando}" th:href="@{/}">Volver al inicio</a>
    </div>
  </form>
</main>
<footer th:replace="~{fragments :: pie}"></footer>

<!-- Ayudas mientras se escribe, la validacion que manda es la del servidor -->
<script>
  (function () {
    // Telefono, deja solo numeros, maximo 9 y les pone los espacios
    var telefono = document.getElementById('telefono');
    if (telefono && !telefono.readOnly) {
      telefono.addEventListener('input', function () {
        var d = telefono.value.replace(/\D/g, '').slice(0, 9);
        var f = d.slice(0, 1);
        if (d.length > 1) f += ' ' + d.slice(1, 5);
        if (d.length > 5) f += ' ' + d.slice(5, 9);
        telefono.value = f;
      });
      // al salir del campo si quedaron 8 digitos se agrega el 9 adelante
      telefono.addEventListener('blur', function () {
        var d = telefono.value.replace(/\D/g, '');
        if (d.length === 8) {
          d = '9' + d;
          telefono.value = d.slice(0, 1) + ' ' + d.slice(1, 5) + ' ' + d.slice(5, 9);
        }
      });
    }
    // Nombre, borra numeros y simbolos y deja un solo espacio entre palabras
    var nombre = document.getElementById('nombre');
    if (nombre && !nombre.readOnly) {
      nombre.addEventListener('input', function () {
        nombre.value = nombre.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü ]/g, '').replace(/ {2,}/g, ' ');
      });
    }
    // Contador de caracteres del comentario
    var comentario = document.getElementById('comentario');
    var usados = document.getElementById('comentario-usados');
    if (comentario && usados) {
      var contar = function () { usados.textContent = comentario.value.length; };
      comentario.addEventListener('input', contar);
      contar();
    }
  })();
</script>
</body>
</html>
