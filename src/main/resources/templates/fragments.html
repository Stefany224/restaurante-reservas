<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Fragmentos que se repiten en todas las paginas, se incluyen con th:replace -->
<head th:fragment="cabeza(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Sabor Gourmet'">Sabor Gourmet</title>
  <link rel="icon" th:href="@{/favicon.ico}">
  <!-- Tipografias de Google Fonts, Cormorant Garamond para los titulos y Karla para el texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;500;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/web.css(v=10)}">
</head>
<body>

<!-- Barra superior, sec:authorize decide si se muestra el menu del cliente o el del personal -->
<header class="barra" th:fragment="menu">
  <a class="marca" sec:authorize="!hasRole('ADMIN')" th:href="@{/}">
    <img th:src="@{/img/logo-emblema-claro.png}" alt="" width="48" height="36">
    <span>Sabor Gourmet</span>
  </a>
  <a class="marca" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/reservas}">
    <img th:src="@{/img/logo-emblema-claro.png}" alt="" width="48" height="36">
    <span>Sabor Gourmet</span>
    <small class="marca-zona">Administración</small>
  </a>

  <!-- Boton de menu hamburguesa que solo aparece en el celular -->
  <button type="button" class="menu-boton" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>

  <nav class="menu" id="menu-principal" aria-label="Menú principal">
    <th:block sec:authorize="!hasRole('ADMIN')">
      <a th:href="@{/}">Inicio</a>
      <a th:href="@{/login}">Personal</a>
    </th:block>
    <!-- Menu del personal sin Inicio porque el personal no reserva -->
    <th:block sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/admin/reservas}">Reservas</a>
      <a th:href="@{/admin/mesas}">Mesas</a>
      <a th:href="@{/admin/clientes}">Clientes</a>
      <!-- Cerrar sesion va por POST y th:action le agrega el token CSRF -->
      <form class="en-linea" method="post" th:action="@{/logout}">
        <button type="submit" class="btn-enlace">Salir</button>
      </form>
    </th:block>
  </nav>

  <script>
    (function () {
      // Abre y cierra el menu en el celular agregando la clase abierta a la barra
      var barra = document.currentScript.closest('.barra');
      var boton = barra.querySelector('.menu-boton');
      boton.addEventListener('click', function () {
        var abierta = barra.classList.toggle('abierta');
        boton.setAttribute('aria-expanded', abierta);
        boton.setAttribute('aria-label', abierta ? 'Cerrar menú' : 'Abrir menú');
      });
    })();
  </script>
</header>

<!-- Mensajes de exito o error que deja el controller -->
<div th:fragment="avisos">
  <p class="aviso exito" th:if="${exito}" th:text="${exito}" role="status"></p>
  <p class="aviso error" th:if="${error}" th:text="${error}" role="alert"></p>
</div>

<!-- Etiqueta de estado de una reserva, finalizada es una activa cuya hora ya paso -->
<th:block th:fragment="estadoReserva(r)">
  <span class="chip ok" th:if="${r.modificable}">Activa</span>
  <span class="chip alerta" th:if="${r.estado.name() == 'CANCELADA'}">Cancelada</span>
  <span class="chip neutro" th:if="${r.estado.name() == 'ACTIVA' and !r.modificable}">Finalizada</span>
</th:block>

<!-- Pie de pagina -->
<footer class="pie" th:fragment="pie">
  <img th:src="@{/img/logo-emblema-claro.png}" alt="" width="64" height="48">
  <p class="pie-nombre">Sabor Gourmet</p>
  <p>Almuerzo de 13:00 a 15:00 y cena de 20:00 a 22:00, de martes a domingo.</p>
  <p class="pie-legal">© 2026 Stefany Pérez</p>
</footer>
</body>
</html>
