<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeza('Error')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<!-- Pagina de error que usa GlobalExceptionHandler, los valores por defecto son para los errores que maneja Spring Boot -->
<main class="angosto centro">
  <p class="codigo-error" th:text="${status} ?: 'Error'">404</p>
  <h1 th:text="${titulo} ?: 'Algo salió mal'">No encontrado</h1>
  <p th:text="${mensaje} ?: 'No pudimos completar la solicitud.'">Mensaje</p>
  <a class="btn" th:href="@{/}">Volver al inicio</a>
</main>
</body>
</html>
